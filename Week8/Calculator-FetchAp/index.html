<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <script>

        async function sum() {
            const a = document.getElementById('num1').value;
            const b = document.getElementById('num2').value;

            const res = await fetch(`http://localhost:3000/sum`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    a: a,
                    b: b
                })
            });
            const data = await res.json();
            document.getElementById('result').innerText = data.result;
        }

        async function subtract() {
            const a = document.getElementById('num1').value;
            const b = document.getElementById('num2').value;

            const res = await fetch(`http://localhost:3000/sub`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    a: a,
                    b: b
                })
            });
            const data = await res.json();
            document.getElementById('result').innerText = data.result;
        }

        async function multiply() {
            const a = document.getElementById('num1').value;
            const b = document.getElementById('num2').value;

            const res = await fetch(`http://localhost:3000/mul`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    a: a,
                    b: b
                })
            });
            const data = await res.json();
            document.getElementById('result').innerText = data.result;
        }

        async function divide() {
            const a = document.getElementById('num1').value;
            const b = document.getElementById('num2').value;

            const res = await fetch(`http://localhost:3000/div`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    a: a,
                    b: b
                })
            });
            const data = await res.json();
            document.getElementById('result').innerText = data.result;
        }
    </script>

</head>

<body>

    <h2>Calculator Using Fetch API</h2>

    <div>
        <label for="num1">Number 1:</label>
        <input type="number" id="num1" name="num1">

        <label for="num2">Number 2:</label>
        <input type="number" id="num2" name="num2">

        <button onclick="sum()">Sum</button>
        <button onclick="subtract()">Subtract</button>
        <button onclick="multiply()">Multiply</button>
        <button onclick="divide()">Divide</button>

    </div>

    <div>
        <h3>Result:</h3>
        <p id="result"></p>
    </div>

</body>

</html>
